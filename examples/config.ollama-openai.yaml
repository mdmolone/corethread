# Ollama local + Ollama judge + OpenAI frontier.
local:
  kind: ollama
  base_url: http://localhost:11434
  model: llama3.1:8b
  num_ctx_default: 8192
  num_ctx_overrides:
    llama3.1:8b: 16384
    qwen2.5:7b: 32768
judge:
  model: qwen2.5:7b
  # Optional: override the judge system prompt. Keep the JSON output contract.
  # prompt: |
  #   You are a strict quality judge...
frontier:
  api_key_env: OPENAI_API_KEY
  base_url: https://api.openai.com/v1
  model: gpt-4o
  max_tokens: 512
model_profiles:
  local-ollama:
    provider: ollama
    base_url: http://localhost:11434
    model: llama3.1:8b
    timeout_s: 120
    num_ctx_default: 8192
    num_ctx_overrides:
      llama3.1:8b: 16384
  judge-ollama:
    provider: ollama
    base_url: http://localhost:11434
    model: qwen2.5:7b
    temperature: 0
    timeout_s: 30
    num_ctx_default: 8192
    num_ctx_overrides:
      qwen2.5:7b: 32768
  frontier-openai:
    provider: openai
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    max_tokens: 512
    timeout_s: 120
role_profiles:
  local: local-ollama
  judge: judge-ollama
  frontier: frontier-openai
routing:
  threshold: 0.7
  constraint_prompt: "Be concise. Limit your answer to a single short paragraph unless the user explicitly asks for more detail."
ui:
  theme: system
privacy:
  capture_transcripts: false
  transcript_max: 25
controls:
  requests_per_minute: null
  daily_request_quota: null
  daily_token_quota: null
  daily_cost_quota_usd: null
  pricing: {}
  audit_enabled: false
  audit_path: outputs/audit.jsonl
  audit_include_request_body: false
