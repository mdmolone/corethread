[project]
name = "corethread"
version = "1.0.0"
description = "Hybrid LLM router: local-first, frontier-on-judge"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.136,<0.137",
    "pydantic>=2.13,<3",
    "pydantic-settings[yaml]>=2.14,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "structlog>=25,<26",
    "openai>=2.32,<3",
]

[project.scripts]
corethread = "corethread.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # ARC-01 keeps these files byte-stable against v1.0.
    "corethread/errors.py",
    "corethread/judge.py",
    "corethread/models.py",
    "corethread/orchestrator.py",
    "corethread/providers/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
